name: Release AiEngine Setup

on:
  push:
    branches:
      - "release-v*"
    tags:
      - "setup-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 setup 标签"
        required: true
        default: "setup-v1.4.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Test
        run: |
          go test ./...
          test "$(sed -n '1{s/\r$//;p;}' scripts/install.ps1)" = '[CmdletBinding()]'

      - name: Build release archives
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            RELEASE_TAG="$RELEASE_INPUT_TAG"
          elif [ "$RELEASE_REF_TYPE" = "branch" ]; then
            RELEASE_TAG="setup-v${RELEASE_REF#release-v}"
          else
            RELEASE_TAG="$RELEASE_REF"
          fi
          version="${RELEASE_TAG#setup-v}"
          mkdir -p dist/work
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="aiengine-setup_${os}_${arch}"
            binary="aiengine-setup"
            if [ "$os" = windows ]; then binary="aiengine-setup.exe"; fi
            build_dir="dist/work/$name"
            mkdir -p "$build_dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$build_dir/$binary" ./cmd/aiengine-setup
            if [ "$os" = windows ]; then
              (cd "$build_dir" && zip -q "../../${name}.zip" "$binary")
            else
              tar -C "$build_dir" -czf "dist/${name}.tar.gz" "$binary"
            fi
          done
          cp scripts/install.sh scripts/install.ps1 dist/
          (
            cd dist
            sha256sum aiengine-setup_*.tar.gz aiengine-setup_*.zip install.sh install.ps1 > CHECKSUMS.txt
            jq -n \
              --arg version "$version" \
              --arg tag "$RELEASE_TAG" \
              --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{schema: 1, version: $version, tag: $tag, published_at: $published_at}' > latest.json
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            RELEASE_TAG="$RELEASE_INPUT_TAG"
          elif [ "$RELEASE_REF_TYPE" = "branch" ]; then
            RELEASE_TAG="setup-v${RELEASE_REF#release-v}"
          else
            RELEASE_TAG="$RELEASE_REF"
          fi
          gh release create "$RELEASE_TAG" \
            --title "AiEngine Setup $RELEASE_TAG" \
            --generate-notes \
            dist/aiengine-setup_*.tar.gz \
            dist/aiengine-setup_*.zip \
            dist/CHECKSUMS.txt \
            dist/latest.json \
            dist/install.sh \
            dist/install.ps1
