location = /install.sh {
    alias /www/wwwroot/newapi.aiare.cloud/aiare-setup/current/install.sh;
    default_type "text/plain; charset=utf-8";
    add_header Cache-Control "no-store" always;
}

location = /install.ps1 {
    alias /www/wwwroot/newapi.aiare.cloud/aiare-setup/current/install.ps1;
    default_type "text/plain; charset=utf-8";
    add_header Cache-Control "no-store" always;
}

location ^~ /aiare-setup/current/ {
    alias /www/wwwroot/newapi.aiare.cloud/aiare-setup/current/;
    autoindex off;
    add_header Cache-Control "no-store" always;
}

location ^~ /aiare-setup/releases/ {
    alias /www/wwwroot/newapi.aiare.cloud/aiare-setup/releases/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
